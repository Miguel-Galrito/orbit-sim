[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-sim"
version = "0.4.0"
description = "Educational orbital mechanics simulator in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "streamlit>=1.36"]

[project.scripts]
orbit-sim = "orbitsim.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
